<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Global error shield for cross-origin iframe security errors and React re-entrancy
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) || '';
        if (
          msg.indexOf('Blocked a frame') !== -1 ||
          msg.indexOf('cross-origin frame') !== -1 ||
          msg.indexOf('SecurityError') !== -1 ||
          msg.indexOf('Should not already be working') !== -1
        ) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var msg = (e && e.reason && (e.reason.message || e.reason)) || '';
        if (typeof msg === 'string' && (
          msg.indexOf('Blocked a frame') !== -1 ||
          msg.indexOf('cross-origin frame') !== -1 ||
          msg.indexOf('SecurityError') !== -1 ||
          msg.indexOf('Should not already be working') !== -1
        )) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      }, true);
    </script>
    <title>MACROVEX 2.1 PRO — Cross-Asset AI Trading & Market Intelligence</title>

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('macromind_theme') || localStorage.getItem('macrovex_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
